<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painéis Integrados - Casa Civil</title>
  
  <!-- Favicon da Prefeitura -->
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/3/30/Bras%C3%A3o_de_Ol%C3%ADmpia%2C_SP.jpg" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            navy: '#003366',
            gold: '#ffb800'
          }
        }
      }
    }
  </script>

  <!-- Estilos base e Fontes -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
    body { 
      background-color: #f1f5f9; /* slate-100 */
      color: #1e293b; 
      overflow: hidden; /* Prevent global scroll, handled by main area */
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>

  <!-- Import Maps para React e Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.300.0?deps=react@18.2.0"
      }
    }
  </script>

  <!-- Babel para transpilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- CÓDIGO FONTE PRINCIPAL -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import * as Icons from "lucide-react";
    import { 
      LayoutDashboard, AlertCircle, RefreshCw, BarChart3, 
      ChevronLeft, LineChart, ArrowRight, Menu, X 
    } from "lucide-react";

    // --- Componente: Notificação Toast ---
    function Toast({ message, onClose }) {
      if (!message) return null;
      return (
        <div className="fixed bottom-6 right-6 bg-slate-900 border border-slate-700 shadow-2xl rounded-lg p-4 z-[60] flex items-start max-w-sm animate-[fadeIn_0.3s_ease-out]">
          <AlertCircle size={20} className="text-gold mr-3 mt-0.5 flex-shrink-0" />
          <div className="text-white text-sm font-medium">{message}</div>
          <button onClick={onClose} className="ml-4 text-slate-400 hover:text-white transition-colors">
            <X size={16} />
          </button>
        </div>
      );
    }

    // --- Componente: Dashboard Card ---
    function DashboardCard({ dashboard, onNotification }) {
      const isMaintenance = dashboard.status === "Em manutenção";
      const hasNoLink = !dashboard.url || dashboard.url === "#";

      const handleClick = (e) => {
        if (isMaintenance) {
          e.preventDefault();
          onNotification("Este painel está em manutenção no momento.");
        } else if (hasNoLink) {
          e.preventDefault();
          onNotification("Este painel ainda não possui um link associado na planilha.");
        }
      };

      return (
        <a 
          href={isMaintenance || hasNoLink ? "#" : dashboard.url} 
          target={isMaintenance || hasNoLink ? "_self" : "_blank"} 
          rel="noopener noreferrer" 
          onClick={handleClick}
          className={`block bg-navy rounded-2xl shadow-sm hover:shadow-xl border ${isMaintenance ? "border-orange-500/50" : "border-navy hover:border-gold"} p-6 flex flex-col transition-all duration-300 transform hover:-translate-y-2 hover:scale-[1.02] relative overflow-hidden group h-48 cursor-pointer`}
        >
          {/* Efeitos de Glow (Hover) */}
          <div className={`absolute top-0 right-0 -mt-10 -mr-10 w-48 h-48 rounded-full opacity-0 blur-3xl transition-all duration-700 group-hover:opacity-30 group-hover:scale-150 ${isMaintenance ? "bg-orange-500" : "bg-gold"}`}></div>
          <div className={`absolute left-0 top-0 bottom-0 w-1.5 transition-all duration-500 ${isMaintenance ? "bg-orange-500" : "bg-transparent group-hover:bg-gold"}`}></div>

          <div className="flex justify-between items-start mb-4 relative z-10 min-h-[28px]">
            <div className="flex-grow">
               <h3 className="text-xl font-bold text-white leading-tight tracking-tight group-hover:text-gold transition-colors line-clamp-2">
                 {dashboard.title}
               </h3>
            </div>
            {isMaintenance && (
              <span className="text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider bg-orange-900/80 text-orange-400 flex-shrink-0 ml-3 border border-orange-700/50">
                Em manutenção
              </span>
            )}
          </div>

          <div className="mt-auto relative z-10 flex justify-between items-end">
            <div className="flex flex-wrap gap-2">
              {dashboard.tags?.map((tag, idx) => (
                <span key={idx} className="bg-slate-800/80 border border-slate-700 text-slate-300 px-2.5 py-1 rounded-md text-[10px] font-semibold tracking-wide">
                  {tag}
                </span>
              ))}
            </div>
            <span className={`transition-colors duration-300 ml-4 flex-shrink-0 ${isMaintenance ? "text-slate-600" : "text-slate-400 group-hover:text-gold"}`}>
              <ArrowRight size={24} className={!isMaintenance ? "group-hover:translate-x-1 transition-transform" : ""} />
            </span>
          </div>
        </a>
      );
    }

    // --- Componente: Sidebar ---
    function Sidebar({ isCollapsed, setIsCollapsed, isMobileOpen, setIsMobileOpen, categories, activeCategory, setActiveCategory }) {
      const handleCategoryClick = (id) => {
        setActiveCategory(id);
        if (isMobileOpen) setIsMobileOpen(false);
      };

      return (
        <>
          {/* Overlay Mobile */}
          {isMobileOpen && (
            <div className="fixed inset-0 bg-black/60 z-40 md:hidden backdrop-blur-sm" onClick={() => setIsMobileOpen(false)} />
          )}

          <aside className={`bg-navy text-white flex-shrink-0 flex flex-col fixed md:relative h-full z-50 transition-all duration-300 ease-in-out ${isCollapsed ? "w-20" : "w-72"} ${isMobileOpen ? "translate-x-0" : "-translate-x-full md:translate-x-0"}`}>
            
            {/* Toggle Button Desktop */}
            <button onClick={() => setIsCollapsed(!isCollapsed)} className={`hidden md:flex absolute -right-3.5 top-8 bg-white py-1 px-1 text-navy rounded-full items-center justify-center shadow-md border border-slate-200 hover:bg-slate-100 z-50 transition-transform duration-300 ${isCollapsed ? "rotate-180" : ""}`}>
              <ChevronLeft size={18} strokeWidth={3} />
            </button>

            {/* Logo Area */}
            <div className="p-6 text-center border-b border-white/10 transition-all duration-300 flex flex-col items-center">
              <div className="bg-white p-2 rounded-xl mb-4 inline-flex items-center justify-center shadow-lg h-24 w-24 overflow-hidden">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/30/Bras%C3%A3o_de_Ol%C3%ADmpia%2C_SP.jpg" alt="Brasão de Olímpia" className="h-full w-full object-contain" />
              </div>
              <h2 className={`text-xs font-bold tracking-widest uppercase text-slate-300 leading-tight transition-all duration-300 ${isCollapsed ? "opacity-0 h-0 overflow-hidden" : "opacity-100"}`}>
                Painéis Integrados
              </h2>
            </div>

            {/* Navegação */}
            <nav className="flex-grow p-4 space-y-2 overflow-y-auto custom-scrollbar">
              {categories.map((cat) => {
                const IconComponent = cat.icon || LayoutDashboard;
                const isActive = activeCategory === cat.id;
                return (
                  <button 
                    key={cat.id} 
                    onClick={() => handleCategoryClick(cat.id)} 
                    className={`w-full flex items-center transition-all duration-200 rounded-lg whitespace-nowrap overflow-hidden ${isCollapsed ? "justify-center p-3" : "p-3.5"} ${isActive ? "bg-gold text-navy font-bold shadow-md" : "text-slate-300 hover:bg-white/10 hover:text-white"}`} 
                    title={isCollapsed ? cat.label : ""}
                  >
                    <IconComponent size={20} className={`flex-shrink-0 ${isCollapsed ? "" : "mr-3"} ${isActive ? "text-navy" : ""}`} />
                    <span className={`text-sm transition-all duration-300 ${isCollapsed ? "opacity-0 w-0" : "opacity-100"}`}>
                      {cat.label}
                    </span>
                  </button>
                )
              })}
            </nav>

            {/* Footer */}
            <div className={`p-6 bg-black/20 text-xs text-slate-400 mt-auto border-t border-white/10 transition-all duration-300 flex flex-col ${isCollapsed ? "items-center" : "items-start"}`}>
              {isCollapsed ? (
                <LineChart size={20} className="text-gold" title="Secretaria Municipal da Casa Civil" />
              ) : (
                <>
                  <p className="font-semibold text-white mb-2">Secretaria Municipal da Casa Civil</p>
                  <p className="mb-4">Olímpia - SP</p>
                  <LineChart size={18} className="text-gold" />
                </>
              )}
            </div>
          </aside>
        </>
      );
    }

    // --- Componente Principal ---
    function App() {
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      
      const [categories, setCategories] = useState([{ id: "todos", label: "Todos os Painéis", icon: BarChart3 }]);
      const [links, setLinks] = useState([]);
      const [activeCategory, setActiveCategory] = useState("todos");
      
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 4000);
      };

      // Efeito Principal de Fetch (Google Apps Script)
      useEffect(() => {
        const fetchData = async () => {
          setIsLoading(true);
          setError(null);
          try {
            const API_URL = "https://script.google.com/macros/s/AKfycbx_k4XYcG6PdFEFlAv-F41SF1lX9iS77Vk3aMem0BSRN5CR0Gi9yweiuXL3GRu1vPSebA/exec";
            const response = await fetch(API_URL);
            
            if (!response.ok) throw new Error("Erro ao conectar com a fonte de dados.");
            
            const rawData = await response.json();
            const rows = rawData.data || rawData; // Trata possíveis envelopes JSON

            if (!Array.isArray(rows) || rows.length === 0) {
               throw new Error("Planilha vazia ou formato não reconhecido.");
            }

            let newCategories = [{ id: "todos", label: "Todos os Painéis", icon: BarChart3 }];
            let newLinks = [];

            // Se for Array de Arrays (Padrão de planilha)
            if (Array.isArray(rows[0])) {
              const headers = rows[0];
              
              headers.forEach((headerStr, colIndex) => {
                const header = String(headerStr).trim();
                if (!header) return;
                
                const catId = header.toLowerCase().replace(/[^a-z0-9]/g, "-");
                newCategories.push({ id: catId, label: header, icon: LayoutDashboard });

                for (let i = 1; i < rows.length; i++) {
                  const cellValue = rows[i][colIndex];
                  if (cellValue && String(cellValue).trim() !== "") {
                    const cellText = String(cellValue).trim();
                    let url = "#";
                    let title = cellText;
                    
                    // Regex para extrair URL
                    const urlMatch = cellText.match(/(https?:\/\/[^\s]+)/);
                    if (urlMatch) {
                      url = urlMatch[1];
                      title = cellText.replace(urlMatch[1], "").replace(/^[\n-]+|[\n-]+$/g, "").trim();
                    }

                    // Detecção simples de manutenção baseada no texto (pode ser ajustado conforme a planilha real)
                    const isMaint = cellText.toLowerCase().includes("[manutenção]");
                    if (isMaint) title = title.replace(/\[manutenção\]/i, "").trim();

                    newLinks.push({
                      id: `link-${colIndex}-${i}`,
                      title: title || "Painel Sem Nome",
                      category: catId,
                      url: url,
                      tags: [header],
                      status: isMaint ? "Em manutenção" : "Ativo"
                    });
                  }
                }
              });
            } else {
              throw new Error("O formato dos dados requer um Array de Arrays.");
            }

            setCategories(newCategories);
            setLinks(newLinks);

          } catch (err) {
            console.error("Fetch Error:", err);
            setError(err.message || "Falha desconhecida ao processar os painéis.");
          } finally {
            setIsLoading(false);
          }
        };

        fetchData();
      }, []);

      const filteredLinks = activeCategory === "todos" 
        ? links 
        : links.filter(l => l.category === activeCategory);

      const activeCategoryLabel = categories.find(c => c.id === activeCategory)?.label || "Painéis";

      return (
        <div className="flex h-screen bg-slate-100 overflow-hidden font-sans">
          
          <Sidebar 
            isCollapsed={isSidebarCollapsed} setIsCollapsed={setIsSidebarCollapsed}
            isMobileOpen={isMobileMenuOpen} setIsMobileOpen={setIsMobileMenuOpen}
            categories={categories} activeCategory={activeCategory} setActiveCategory={setActiveCategory}
          />

          <main className="flex-grow flex flex-col min-w-0 h-full relative">
            
            {/* Header */}
            <header className="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 lg:px-8 z-30 flex-shrink-0">
              <div className="flex items-center">
                <button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden text-navy hover:bg-slate-100 p-2 -ml-2 mr-2 rounded-md transition-colors">
                  <Menu size={24} />
                </button>
                <h1 className="text-lg lg:text-xl font-bold text-slate-700 tracking-tight">
                  {activeCategoryLabel}
                </h1>
              </div>
              <div>
                <span className="bg-blue-100 text-navy px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest border border-blue-200 shadow-sm">
                  Ano 2026
                </span>
              </div>
            </header>

            {/* Conteúdo Principal (Scrollable) */}
            <div className="flex-grow overflow-y-auto p-6 md:p-10 w-full relative">
              <div className="max-w-7xl mx-auto">
                
                {/* Título de Boas-vindas */}
                <div className="mb-10 border-b border-slate-200 pb-6">
                  <h2 className="text-3xl md:text-4xl font-black text-navy uppercase tracking-tighter mb-4 flex items-center gap-3">
                    <LayoutDashboard className="text-gold" size={36} strokeWidth={2.5} />
                    Painéis Analíticos
                  </h2>
                  <p className="text-slate-600 text-base font-medium leading-relaxed max-w-3xl">
                    Acesse de forma centralizada todos os observatórios, indicadores e relatórios gerenciais da Secretaria Municipal da Casa Civil.
                  </p>
                </div>

                {/* Tratamento de Estados */}
                {error && (
                  <div className="mb-8 bg-red-50 text-red-700 p-5 rounded-xl flex items-start border border-red-200 shadow-sm">
                    <AlertCircle size={24} className="mr-4 flex-shrink-0 mt-0.5" />
                    <div>
                      <h4 className="font-bold text-lg mb-1">Erro de Sincronização</h4>
                      <p className="text-sm">{error}</p>
                    </div>
                  </div>
                )}

                {isLoading ? (
                  <div className="flex flex-col justify-center items-center py-32 opacity-70">
                    <RefreshCw className="animate-spin text-navy mb-4" size={48} strokeWidth={1.5} />
                    <span className="text-navy font-bold text-lg">Carregando painéis atualizados...</span>
                  </div>
                ) : (
                  <>
                    {filteredLinks.length > 0 ? (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
                        {filteredLinks.map((dashboard) => (
                          <DashboardCard key={dashboard.id} dashboard={dashboard} onNotification={showToast} />
                        ))}
                      </div>
                    ) : (
                      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-16 text-center flex flex-col items-center mt-6">
                        <BarChart3 size={64} className="text-slate-300 mb-6" strokeWidth={1} />
                        <h3 className="text-2xl font-bold text-navy mb-3">Nenhum painel encontrado</h3>
                        <p className="text-slate-500 text-base max-w-md">Não há relatórios ou indicadores cadastrados para a categoria selecionada no momento.</p>
                        <button onClick={() => setActiveCategory("todos")} className="mt-8 bg-navy text-white px-8 py-3 rounded-xl text-sm font-bold shadow-lg shadow-navy/20 hover:bg-gold hover:text-navy hover:shadow-gold/20 transition-all duration-300">
                          Exibir Todos os Painéis
                        </button>
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          </main>

          {/* Toast Global */}
          <Toast message={toastMsg} onClose={() => setToastMsg(null)} />
          
          <style dangerouslySetInnerHTML={{__html: `
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(10px); }
              to { opacity: 1; transform: translateY(0); }
            }
          `}} />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
